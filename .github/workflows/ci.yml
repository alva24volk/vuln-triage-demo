name: CI

# Pipeline "que declara DevSecOps": corre build y tests en cada push,
# como cualquier repo con CI/CD moderno. A propósito, NO tiene ningún
# paso de escaneo de seguridad todavía — ese es el estado inicial que
# la charla usa como punto de partida antes de agregar el gate.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
